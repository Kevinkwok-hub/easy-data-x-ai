name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run docs:build

  python-compile:
    name: Python Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install D1 test dependencies
        run: python -m pip install "langchain-core>=1.2.27,<2"

      - name: Test D1 import paths
        run: python -m unittest discover -s code -p 'test_example_import_paths.py' -v

      - name: Test D1 tool call loop
        run: PYTHONPATH=code/D1 python -m unittest discover -s code/D1 -p 'test_tool_call_loop.py' -v

      - name: Compile Python examples
        run: python -m compileall code
